<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛顿第二定律</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f5f7fa; color: #222; padding: 20px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .ctrl { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .ctrl label { width: 130px; font-size: 14px; }
  .ctrl input[type=range] { flex: 1; min-width: 180px; }
  .ctrl .val { width: 70px; text-align: right; font-variant-numeric: tabular-nums;
               font-weight: 600; color: #1565c0; }
  .btns { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .btns button { padding: 8px 18px; font-size: 14px; border: 1px solid #ccc;
                 border-radius: 6px; background: #fff; cursor: pointer; }
  .btns button:hover { background: #f0f0f0; }
  table.data { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  table.data th, table.data td { border: 1px solid #aaa; padding: 6px 10px; text-align: center; }
  table.data th { background: #e0f7fa; font-weight: 600; }
  canvas { width: 100%; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; display:block; margin-bottom: 12px; }
  .chart-title { font-size: 14px; font-weight: bold; margin: 8px 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>牛顿第二定律（F = ma）</h1>
  <p class="desc">恒力作用下小车从静止开始做匀加速直线运动。调节质量与外力，观察加速度、位移、速度随时间的变化。</p>
  <div class="panel">
    <div class="ctrl">
      <label for="m">质量 m (kg)</label>
      <input type="range" id="m" min="0.1" max="10" step="0.1" value="1">
      <span class="val" id="mv">1.0</span>
    </div>
    <div class="ctrl">
      <label for="F">外力 F (N)</label>
      <input type="range" id="F" min="0" max="20" step="0.1" value="5">
      <span class="val" id="Fv">5.0</span>
    </div>
    <div class="btns">
      <button id="btnStart">▶ 开始</button>
      <button id="btnPause">⏹ 暂停</button>
      <button id="btnReset">🔄 重置</button>
    </div>
    <table class="data">
      <tr><th>⏱ 时间 (s)</th><th>📏 实际位移 (m)</th><th>💨 瞬时速度 (m/s)</th><th>⚡ 加速度 (m/s²)</th></tr>
      <tr><td id="dT">0.00</td><td id="dX">0.00</td><td id="dV">0.00</td><td id="dA">5.00</td></tr>
    </table>
  </div>
  <canvas id="cvMain" width="940" height="180"></canvas>
  <div class="chart-title">位移-时间 (x-t) 轨迹追踪</div>
  <canvas id="cvChart" width="940" height="320"></canvas>
</div>
<script>
(function(){
  var cvMain = document.getElementById('cvMain');
  var ctxM = cvMain.getContext('2d');
  var cvChart = document.getElementById('cvChart');
  var ctxC = cvChart.getContext('2d');
  var WM = cvMain.width, HM = cvMain.height;
  var WC = cvChart.width, HC = cvChart.height;

  var m = 1.0, F = 5.0, t = 0;
  var running = false;
  var lastTs = null;

  // 主画面 PlotRange {{-1,51},{-1,3}}, AspectRatio 1/8
  var mxMin=-1, mxMax=51, myMin=-1, myMax=3;
  function mx(x){ return (x-mxMin)/(mxMax-mxMin)*WM; }
  function my(y){ return HM-(y-myMin)/(myMax-myMin)*HM; }

  function physics(){
    var a = m>0 ? F/m : 0;
    var x = 0.5*a*t*t;
    var v = a*t;
    var maxDist = 0.5*a*25;
    var scale = maxDist>50 ? 50/maxDist : 1;
    return {a:a, x:x, v:v, scale:scale};
  }

  function drawMain(){
    var p = physics();
    ctxM.clearRect(0,0,WM,HM);
    // 地面轨道
    ctxM.strokeStyle='#888'; ctxM.lineWidth=3;
    ctxM.beginPath(); ctxM.moveTo(mx(-1),my(0)); ctxM.lineTo(mx(51),my(0)); ctxM.stroke();
    // 刻度 0,5,10...50
    ctxM.strokeStyle='#000'; ctxM.lineWidth=1; ctxM.fillStyle='#000';
    ctxM.font='bold 11px sans-serif'; ctxM.textAlign='center';
    for(var i=0;i<=50;i+=5){
      ctxM.beginPath(); ctxM.moveTo(mx(i),my(-0.3)); ctxM.lineTo(mx(i),my(0.3)); ctxM.stroke();
      ctxM.fillText(i, mx(i), my(-0.6));
    }
    // 小车平移偏移
    var ox = p.x * p.scale;
    // 残影矩形 {0,0}->{scale,1}
    ctxM.globalAlpha=0.15; ctxM.fillStyle='blue';
    ctxM.fillRect(mx(ox), my(1), mx(ox+p.scale)-mx(ox), my(0)-my(1));
    ctxM.globalAlpha=1;
    // 车厢 {0,0.2}->{2,1.2} 蓝边黑
    ctxM.fillStyle='blue'; ctxM.strokeStyle='#000'; ctxM.lineWidth=1.5;
    ctxM.fillRect(mx(ox), my(1.2), mx(ox+2)-mx(ox), my(0.2)-my(1.2));
    ctxM.strokeRect(mx(ox), my(1.2), mx(ox+2)-mx(ox), my(0.2)-my(1.2));
    // 车轮
    ctxM.fillStyle='#000';
    ctxM.beginPath(); ctxM.arc(mx(ox+0.5), my(0.2), Math.abs(my(0.5)-my(0.2)), 0, 2*Math.PI); ctxM.fill();
    ctxM.beginPath(); ctxM.arc(mx(ox+1.5), my(0.2), Math.abs(my(0.5)-my(0.2)), 0, 2*Math.PI); ctxM.fill();
    // 速度箭头
    var arrowLen = Math.min(p.v/2, 6);
    if(arrowLen > 0.001){
      ctxM.strokeStyle='#e53935'; ctxM.lineWidth=2.5;
      ctxM.beginPath();
      ctxM.moveTo(mx(ox+2.2), my(0.7));
      ctxM.lineTo(mx(ox+2.2+arrowLen), my(0.7));
      ctxM.stroke();
      // 箭头头部
      var hx = mx(ox+2.2+arrowLen), hy = my(0.7);
      ctxM.beginPath();
      ctxM.moveTo(hx, hy);
      ctxM.lineTo(hx-7, hy-4);
      ctxM.lineTo(hx-7, hy+4);
      ctxM.closePath(); ctxM.fillStyle='#e53935'; ctxM.fill();
    }
  }

  function drawChart(){
    var p = physics();
    var a = p.a;
    var yTop = Math.max(100, 0.5*a*25);
    ctxC.clearRect(0,0,WC,HC);
    // 边距
    var padL=60, padR=30, padT=40, padB=40;
    var iw = WC-padL-padR, ih = HC-padT-padB;
    // x: 0..5, y: 0..yTop
    function cx(tt){ return padL + tt/5*iw; }
    function cy(xx){ return padT + ih - xx/yTop*ih; }
    // 网格
    ctxC.strokeStyle='#e0e0e0'; ctxC.lineWidth=1;
    for(var i=0;i<=5;i++){
      ctxC.beginPath(); ctxC.moveTo(cx(i), padT); ctxC.lineTo(cx(i), padT+ih); ctxC.stroke();
    }
    var yStep = yTop/5;
    for(var j=0;j<=5;j++){
      ctxC.beginPath(); ctxC.moveTo(padL, cy(j*yStep)); ctxC.lineTo(padL+iw, cy(j*yStep)); ctxC.stroke();
    }
    // 坐标轴标签
    ctxC.fillStyle='#000'; ctxC.font='12px sans-serif'; ctxC.textAlign='center';
    for(var k=0;k<=5;k++) ctxC.fillText(k.toFixed(0), cx(k), padT+ih+16);
    ctxC.textAlign='right';
    for(var l=0;l<=5;l++) ctxC.fillText((l*yStep).toFixed(0), padL-6, cy(l*yStep)+4);
    // 轴标签
    ctxC.textAlign='center';
    ctxC.fillText('时间 t (s)', padL+iw/2, HC-8);
    ctxC.save(); ctxC.translate(14, padT+ih/2); ctxC.rotate(-Math.PI/2);
    ctxC.fillText('位移 x (m)', 0, 0); ctxC.restore();
    // 曲线
    ctxC.strokeStyle='#2e7d32'; ctxC.lineWidth=2.5;
    ctxC.beginPath();
    for(var tt=0; tt<=5; tt+=0.02){
      var xx = 0.5*a*tt*tt;
      if(tt===0) ctxC.moveTo(cx(tt), cy(xx));
      else ctxC.lineTo(cx(tt), cy(xx));
    }
    ctxC.stroke();
    // 填充
    ctxC.lineTo(cx(5), cy(0)); ctxC.lineTo(cx(0), cy(0)); ctxC.closePath();
    ctxC.fillStyle='rgba(46,125,50,0.15)'; ctxC.fill();
    // 当前点
    var curX = 0.5*a*t*t;
    ctxC.fillStyle='red';
    ctxC.beginPath(); ctxC.arc(cx(t), cy(curX), 5, 0, 2*Math.PI); ctxC.fill();
    // 标题
    ctxC.fillStyle='#000'; ctxC.font='bold 14px sans-serif';
    ctxC.fillText('位移-时间 (x-t) 轨迹追踪', WC/2, 20);
  }

  function updateTable(){
    var p = physics();
    document.getElementById('dT').textContent = t.toFixed(2);
    document.getElementById('dX').textContent = p.x.toFixed(2);
    document.getElementById('dV').textContent = p.v.toFixed(2);
    document.getElementById('dA').textContent = p.a.toFixed(2);
  }

  function drawAll(){
    drawMain(); drawChart(); updateTable();
  }

  function loop(ts){
    if(running){
      if(lastTs===null) lastTs = ts;
      var dt = (ts-lastTs)/1000;
      lastTs = ts;
      t += dt;
      if(t >= 5){ t = 5; running = false; }
    }
    drawAll();
    requestAnimationFrame(loop);
  }

  // 控件绑定
  function bindRange(id, key){
    var el = document.getElementById(id);
    var out = document.getElementById(id+'v');
    el.addEventListener('input', function(){
      var val = parseFloat(el.value);
      window[key] = val;
      out.textContent = val.toFixed(1);
      drawAll();
    });
  }
  // 用闭包变量而非全局
  var mEl = document.getElementById('m'), fEl = document.getElementById('F');
  mEl.addEventListener('input', function(){ m=parseFloat(mEl.value); document.getElementById('mv').textContent=m.toFixed(1); drawAll(); });
  fEl.addEventListener('input', function(){ F=parseFloat(fEl.value); document.getElementById('Fv').textContent=F.toFixed(1); drawAll(); });

  document.getElementById('btnStart').addEventListener('click', function(){
    if(t>=5) t=0;
    running = true; lastTs=null;
  });
  document.getElementById('btnPause').addEventListener('click', function(){ running=false; });
  document.getElementById('btnReset').addEventListener('click', function(){ running=false; t=0; drawAll(); });

  drawAll();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
