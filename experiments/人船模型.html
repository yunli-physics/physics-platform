<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人船模型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f5f7fa; color: #222; padding: 20px; }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .layout { display: flex; gap: 20px; flex-wrap: wrap; }
  .left { width: 290px; flex-shrink: 0; }
  .right { flex: 1; min-width: 380px; }
  .h2 { font-weight: 700; font-size: 16px; margin: 6px 0 10px; }
  .ctrl { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .ctrl label { width: 130px; font-size: 13px; }
  .ctrl input[type=range] { flex: 1; min-width: 120px; }
  .ctrl .val { width: 60px; text-align: right; font-variant-numeric: tabular-nums;
               font-weight: 600; color: #1565c0; }
  .data { font-size: 14px; line-height: 1.9; margin-top: 10px; }
  .data b { color: #1565c0; }
  .ok { color:#2e7d32; font-weight:700; }
  canvas { width: 100%; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; display:block; }
  .formula { background:#fff8e1; border-radius:8px; padding:12px 16px; margin-top:12px; font-size:14px; line-height:1.9; }
  .formula .it { font-style: italic; }
  .formula .hd { font-weight:700; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>人船模型</h1>
  <p class="desc">人在静止的船上行走，系统水平方向动量守恒、质心位置不变。船后退、人前进。</p>
  <div class="panel layout">
    <div class="left">
      <div class="h2">人船模型参数调节</div>
      <div class="ctrl"><label>人的质量 m₁ (kg)</label><input type="range" id="mM" min="40" max="100" step="1" value="60"><span class="val" id="mMv">60</span></div>
      <div class="ctrl"><label>船的质量 m₂ (kg)</label><input type="range" id="mB" min="50" max="300" step="1" value="120"><span class="val" id="mBv">120</span></div>
      <div class="ctrl"><label>船的长度 L (m)</label><input type="range" id="LB" min="3" max="10" step="0.1" value="6"><span class="val" id="LBv">6.0</span></div>
      <div class="ctrl"><label>人行走距离 d (m)</label><input type="range" id="LW" min="0.1" max="6" step="0.1" value="4"><span class="val" id="LWv">4.0</span></div>
      <div class="h2" style="margin-top:16px">物理量实时监测</div>
      <div class="data">
        船后退距离: <b id="dBoat">0.000</b> m<br>
        人前进距离: <b id="dMan">0.000</b> m<br>
        系统质心位移: <b id="dCM">0.0000</b> m<br>
        质心守恒验证: <span class="ok" id="dOk"> 成立</span>
      </div>
    </div>
    <div class="right">
      <div class="cap" style="font-size:13px;color:#444;text-align:center;margin-bottom:4px">人船相对运动轨迹</div>
      <canvas id="cv" width="600" height="300"></canvas>
      <div class="formula">
        <div class="hd">核心公式推导:</div>
        1. 动量守恒: <span class="it">m₁v₁ = m₂v₂</span><br>
        2. 位移关系: <span class="it">m₁x₁ = m₂x₂</span><br>
        3. 几何约束: <span class="it">x₁ + x₂ = d</span><br>
        <div class="hd" style="margin-top:6px">代入当前计算:</div>
        <span id="f1"></span><br>
        <span id="f2"></span>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var P={mM:60,mB:120,LB:6,LW:4};
  var cv=document.getElementById('cv'), cx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  // PlotRange {{-15,15},{-3,3}}
  function sx(x){ return (x+15)/30*W; }
  function sy(y){ return H-(y+3)/6*H; }
  function update(){
    var mMan=P.mM, mBoat=P.mB, LBoat=P.LB, LWalk=P.LW;
    var xBoat = mMan*LWalk/(mMan+mBoat);
    var xMan = LWalk - xBoat;
    var cm = (mMan*xMan - mBoat*xBoat)/(mMan+mBoat);
    document.getElementById('dBoat').textContent=xBoat.toFixed(3);
    document.getElementById('dMan').textContent=xMan.toFixed(3);
    document.getElementById('dCM').textContent=cm.toFixed(4);
    var ok=document.getElementById('dOk');
    if(Math.abs(cm)<1e-10){ ok.textContent=' 成立'; ok.className='ok'; }
    else { ok.textContent=' ✘ 不成立'; ok.style.color='#e53935'; }
    document.getElementById('f1').textContent = mMan+' × '+xMan.toFixed(3)+' = '+(mMan*xMan).toFixed(3);
    document.getElementById('f2').textContent = mBoat+' × '+xBoat.toFixed(3)+' = '+(mBoat*xBoat).toFixed(3);
    // draw
    cx.clearRect(0,0,W,H);
    // water
    cx.fillStyle='#cdeffd';
    cx.fillRect(sx(-15),sy(-0.5),sx(15)-sx(-15),sy(-2)-sy(-0.5));
    // water surface line
    cx.strokeStyle='#000'; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(sx(-15),sy(-0.5)); cx.lineTo(sx(15),sy(-0.5)); cx.stroke();
    // boat brown
    cx.fillStyle='#8d6e63';
    cx.fillRect(sx(-xBoat-LBoat/2),sy(0.5),sx(-xBoat+LBoat/2)-sx(-xBoat-LBoat/2),sy(-0.5)-sy(0.5));
    cx.fillStyle='#fff'; cx.font='bold 14px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('船',sx(-xBoat),sy(0));
    // man red disk at (xMan-LBoat/2,1)
    var mx=xMan-LBoat/2;
    cx.fillStyle='#e53935';
    cx.beginPath(); cx.arc(sx(mx),sy(1),sx(0.3)-sx(0),0,2*Math.PI); cx.fill();
    cx.fillStyle='#fff'; cx.font='bold 13px sans-serif';
    cx.fillText('人',sx(mx),sy(1));
    // origin dashed
    cx.strokeStyle='#999'; cx.lineWidth=1.5; cx.setLineDash([6,4]);
    cx.beginPath(); cx.moveTo(sx(0),sy(-2)); cx.lineTo(sx(0),sy(2)); cx.stroke();
    cx.setLineDash([]);
    cx.fillStyle='#555'; cx.font='12px sans-serif'; cx.textAlign='left'; cx.textBaseline='alphabetic';
    cx.fillText('地面原点',sx(0.5),sy(1.8));
  }
  function bind(id,key,isInt){
    var el=document.getElementById(id);
    el.addEventListener('input',function(){
      var v=parseFloat(el.value); P[key]=v;
      document.getElementById(id+'v').textContent=isInt?String(Math.round(v)):v.toFixed(1);
      if(key==='LB'){
        var lw=document.getElementById('LW');
        lw.max=v; if(parseFloat(lw.value)>v){ lw.value=v; P.LW=v; document.getElementById('LWv').textContent=v.toFixed(1);}
      }
      update();
    });
  }
  bind('mM','mM',true); bind('mB','mB',true); bind('LB','LB',false); bind('LW','LW',false);
  update();
})();
</script>
</body>
</html>
