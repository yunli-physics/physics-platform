<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动量定理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f5f7fa; color: #222; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .layout { display: flex; gap: 20px; flex-wrap: wrap; }
  .left { width: 290px; flex-shrink: 0; }
  .right { flex: 1; min-width: 360px; }
  .h2 { font-weight: 700; font-size: 16px; margin: 6px 0 10px; }
  .ctrl { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .ctrl label { width: 130px; font-size: 13px; }
  .ctrl input[type=range] { flex: 1; min-width: 120px; }
  .ctrl .val { width: 64px; text-align: right; font-variant-numeric: tabular-nums;
               font-weight: 600; color: #1565c0; }
  .data { font-size: 14px; line-height: 1.9; margin-top: 10px; }
  .data b { color: #1565c0; }
  canvas { width: 100%; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; display:block; }
  .row2 { display:flex; gap: 12px; margin-top: 12px; }
  .row2 canvas { flex: 1; }
  .cap { font-size: 13px; color:#444; text-align:center; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>动量定理</h1>
  <p class="desc">恒力作用一段时间后物体匀速运动。F-t 图面积等于冲量，p-t 图变化量等于冲量。</p>
  <div class="panel layout">
    <div class="left">
      <div class="h2">动量定理参数调节</div>
      <div class="ctrl"><label>质量 m (kg)</label><input type="range" id="m" min="0.1" max="10" step="0.1" value="2"><span class="val" id="mv">2.00</span></div>
      <div class="ctrl"><label>初速度 v₀ (m/s)</label><input type="range" id="v0" min="-5" max="10" step="0.1" value="0"><span class="val" id="v0v">0.00</span></div>
      <div class="ctrl"><label>恒力 F (N)</label><input type="range" id="F" min="-20" max="20" step="0.5" value="10"><span class="val" id="Fv">10.0</span></div>
      <div class="ctrl"><label>作用时间 Δt (s)</label><input type="range" id="tF" min="0.1" max="5" step="0.1" value="2"><span class="val" id="tFv">2.00</span></div>
      <div class="ctrl"><label>观察时间 t (s)</label><input type="range" id="t" min="0" max="6" step="0.05" value="0"><span class="val" id="tv">0.00</span></div>
      <div class="h2" style="margin-top:16px">实时数据监测</div>
      <div class="data">
        当前时刻 t: <b id="dT">0.00</b> s<br>
        当前动量 p: <b id="dP">0.000</b> kg·m/s<br>
        累积冲量 I: <b id="dI">0.000</b> N·s<br>
        动量变化 Δp: <b id="dD">0.000</b> kg·m/s
      </div>
    </div>
    <div class="right">
      <div class="cap">物体受力运动轨迹</div>
      <canvas id="cv" width="600" height="240"></canvas>
      <div class="row2">
        <div>
          <div class="cap">F-t 图 (面积=冲量)</div>
          <canvas id="cf" width="290" height="240"></canvas>
        </div>
        <div>
          <div class="cap">p-t 图 (Δp=冲量)</div>
          <canvas id="cp" width="290" height="240"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var P = { m:2, v0:0, F:10, tF:2, t:0 };
  var tTotal = 6;
  function vfun(t){ return (t<=P.tF) ? P.v0 + (P.F/P.m)*t : (P.m*P.v0+P.F*P.tF)/P.m; }
  function pfun(t){ return P.m*vfun(t); }
  function xfun(t){
    if(t<=P.tF) return P.v0*t + 0.5*(P.F/P.m)*t*t;
    var xt = P.v0*P.tF + 0.5*(P.F/P.m)*P.tF*P.tF;
    return xt + vfun(P.tF)*(t-P.tF);
  }
  // main canvas mapping: PlotRange {{-5,15},{-2,2}}
  var cv=document.getElementById('cv'), cx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  function sx(x){ return (x+5)/20*W; }
  function sy(y){ return H-(y+2)/4*H; }
  function drawMain(){
    cx.clearRect(0,0,W,H);
    // axes
    cx.strokeStyle='#888'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(0,sy(0)); cx.lineTo(W,sy(0)); cx.stroke();
    // track
    cx.strokeStyle='#888'; cx.lineWidth=3;
    cx.beginPath(); cx.moveTo(sx(-5),sy(0)); cx.lineTo(sx(15),sy(0)); cx.stroke();
    // dashed x=0
    cx.strokeStyle='#ccc'; cx.lineWidth=1.5; cx.setLineDash([5,4]);
    cx.beginPath(); cx.moveTo(sx(0),sy(-0.8)); cx.lineTo(sx(0),sy(0.8)); cx.stroke();
    cx.setLineDash([]);
    var tc = Math.min(P.t,tTotal);
    var x = xfun(tc);
    // ball
    cx.fillStyle='#1565c0';
    cx.beginPath(); cx.arc(sx(x),sy(0),sx(0.4)-sx(0),0,2*Math.PI); cx.fill();
    // force arrow
    if(tc<=P.tF && P.F!==0){
      var s = Math.sign(P.F);
      var ax = sx(x + 0.5*s), ay = sy(0.8);
      var bx = sx(x + 0.5*s + P.F/5);
      cx.strokeStyle='#e53935'; cx.lineWidth=2.5;
      cx.beginPath(); cx.moveTo(ax,ay); cx.lineTo(bx,ay); cx.stroke();
      // arrowhead
      cx.beginPath(); cx.moveTo(bx,ay); cx.lineTo(bx - 6*s, ay-4); cx.lineTo(bx - 6*s, ay+4); cx.closePath(); cx.fillStyle='#e53935'; cx.fill();
      cx.fillStyle='#e53935'; cx.font='bold 14px sans-serif';
      cx.fillText('F', sx(x+0.5*s+P.F/10), sy(1.3));
    }
  }
  // F-t plot: {{0,6},{-25,25}}
  var cf=document.getElementById('cf'), xf=cf.getContext('2d');
  var WF=cf.width,HF=cf.height;
  function fX(t){ return t/tTotal*WF; }
  function fY(f){ return HF-(f+25)/50*HF; }
  function drawF(){
    xf.clearRect(0,0,WF,HF);
    // axes
    xf.strokeStyle='#888'; xf.lineWidth=1;
    xf.beginPath(); xf.moveTo(0,fY(0)); xf.lineTo(WF,fY(0)); xf.stroke();
    xf.beginPath(); xf.moveTo(fX(0),0); xf.lineTo(fX(0),HF); xf.stroke();
    // filled area
    xf.fillStyle='rgba(229,57,53,0.3)';
    xf.beginPath(); xf.moveTo(fX(0),fY(0));
    xf.lineTo(fX(0),fY(P.F)); xf.lineTo(fX(P.tF),fY(P.F)); xf.lineTo(fX(P.tF),fY(0));
    xf.closePath(); xf.fill();
    xf.strokeStyle='#e53935'; xf.lineWidth=2;
    xf.beginPath(); xf.moveTo(fX(0),fY(P.F)); xf.lineTo(fX(P.tF),fY(P.F));
    xf.lineTo(fX(tTotal),fY(0)); xf.stroke();
    xf.fillStyle='#555'; xf.font='12px sans-serif';
    xf.fillText('t', WF-12, fY(0)-4);
    xf.fillText('F', 4, 12);
  }
  // p-t plot: {{0,6},{-50,100}}
  var cp=document.getElementById('cp'), xp=cp.getContext('2d');
  var WP=cp.width,HP=cp.height;
  function pX(t){ return t/tTotal*WP; }
  function pY(p){ return HP-(p+50)/150*HP; }
  function drawP(){
    xp.clearRect(0,0,WP,HP);
    xp.strokeStyle='#888'; xp.lineWidth=1;
    xp.beginPath(); xp.moveTo(0,pY(0)); xp.lineTo(WP,pY(0)); xp.stroke();
    xp.beginPath(); xp.moveTo(pX(0),0); xp.lineTo(pX(0),HP); xp.stroke();
    // p(t) curve: linear during force, constant after
    var pf = pfun(P.tF);
    xp.strokeStyle='#1565c0'; xp.lineWidth=2;
    xp.beginPath(); xp.moveTo(pX(0),pY(pfun(0)));
    xp.lineTo(pX(P.tF),pY(pf)); xp.lineTo(pX(tTotal),pY(pf)); xp.stroke();
    // current point
    var tc=Math.min(P.t,tTotal);
    xp.fillStyle='#e53935';
    xp.beginPath(); xp.arc(pX(tc),pY(pfun(tc)),5,0,2*Math.PI); xp.fill();
    xp.fillStyle='#555'; xp.font='12px sans-serif';
    xp.fillText('t', WP-12, pY(0)-4);
    xp.fillText('p', 4, 12);
  }
  function update(){
    var tc=Math.min(P.t,tTotal);
    var cp2=pfun(tc);
    var imp = tc<=P.tF ? P.F*tc : P.F*P.tF;
    document.getElementById('dT').textContent=tc.toFixed(2);
    document.getElementById('dP').textContent=cp2.toFixed(3);
    document.getElementById('dI').textContent=imp.toFixed(3);
    document.getElementById('dD').textContent=(cp2-P.m*P.v0).toFixed(3);
    drawMain(); drawF(); drawP();
  }
  function bind(id,key,dec){
    var el=document.getElementById(id);
    el.addEventListener('input',function(){
      P[key]=parseFloat(el.value);
      document.getElementById(id+'v').textContent=parseFloat(el.value).toFixed(dec);
      update();
    });
  }
  bind('m','m',2); bind('v0','v0',2); bind('F','F',1); bind('tF','tF',2); bind('t','t',2);
  update();
})();
</script>
</body>
</html>
