<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>折射光路可逆与全反射</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f5f7fa; color: #222; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .ctrl { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .ctrl label { width: 150px; font-size: 14px; }
  .ctrl input[type=range] { flex: 1; min-width: 180px; }
  .ctrl .val { width: 70px; text-align: right; font-variant-numeric: tabular-nums;
               font-weight: 600; color: #1565c0; }
  .seg { display:inline-flex; border:1px solid #cfd8dc; border-radius:8px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:6px 14px; font-size:13px; cursor:pointer;
                color:#455a64; font-family:inherit; }
  .seg button.on { background:#1565c0; color:#fff; }
  canvas { width: 100%; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>折射光线、光路可逆与全反射</h1>
  <p class="desc">斯涅尔定律 n₁sinθ₁ = n₂sinθ₂。可切换介质（水/玻璃）与光路方向（空气↔介质），演示光路可逆；当光由光密介质射向空气且 sinθ₂&gt;1 时发生全反射。</p>
  <div class="panel">
    <div class="ctrl">
      <label for="th">入射角 θ₁ (°)</label>
      <input type="range" id="th" min="0" max="89" step="1" value="30">
      <span class="val" id="thv">30°</span>
    </div>
    <div class="ctrl">
      <label>介质</label>
      <span class="seg" id="medSeg">
        <button data-v="1" class="on">水 (n≈1.33)</button>
        <button data-v="2">玻璃 (n≈1.5)</button>
      </span>
    </div>
    <div class="ctrl">
      <label>光路方向</label>
      <span class="seg" id="dirSeg">
        <button data-v="am" class="on">空气→介质</button>
        <button data-v="ma">介质→空气</button>
      </span>
    </div>
  </div>
  <canvas id="cv" width="600" height="450"></canvas>
</div>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var xMin=-2, xMax=2, yMin=-1.5, yMax=1.5;
  var thetaDeg = 30;
  var medium = 1;      // 1=水 2=玻璃
  var direction = 'am'; // am: 空气->介质; ma: 介质->空气

  function sx(x){ return (x-xMin)/(xMax-xMin)*W; }
  function sy(y){ return H - (y-yMin)/(yMax-yMin)*H; }

  function drawArrow(x1,y1,x2,y2,color){
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx(x1),sy(y1)); ctx.lineTo(sx(x2),sy(y2)); ctx.stroke();
    var ang = Math.atan2(sy(y2)-sy(y1), sx(x2)-sx(x1));
    var s=10;
    ctx.beginPath();
    ctx.moveTo(sx(x2),sy(y2));
    ctx.lineTo(sx(x2)-s*Math.cos(ang-Math.PI/7), sy(y2)-s*Math.sin(ang-Math.PI/7));
    ctx.moveTo(sx(x2),sy(y2));
    ctx.lineTo(sx(x2)-s*Math.cos(ang+Math.PI/7), sy(y2)-s*Math.sin(ang+Math.PI/7));
    ctx.stroke();
  }

  function drawGrid(rows){
    var x0=-1.7, y0=-1.25;
    var cw1=1.15, cw2=1.0, rh=0.3;
    ctx.font='13px "Microsoft YaHei", sans-serif';
    for(var i=0;i<rows.length;i++){
      var yy=y0+i*rh;
      ctx.strokeStyle='#999'; ctx.lineWidth=1;
      ctx.strokeRect(sx(x0), sy(yy+rh), (cw1+cw2)/(xMax-xMin)*W, rh/(yMax-yMin)*H);
      ctx.fillStyle='#222'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(rows[i][0], sx(x0)+5, sy(yy+rh/2));
      ctx.fillText(rows[i][1], sx(x0+cw1)+5, sy(yy+rh/2));
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    var n1 = 1.0;
    var n2 = (medium===1)? 4/3 : 1.5;
    var th1 = thetaDeg*Math.PI/180;
    var sin1 = Math.sin(th1);
    var sin2, th2, ratio, tir=false;
    var rayIn, rayRefr = null;

    if(direction==='am'){
      sin2 = (n1/n2)*sin1;
      if(sin2 > 1){ tir=true; ratio='全反射'; }
      else {
        th2 = Math.asin(sin2);
        rayRefr = [0,0, 1.2*Math.tan(th2), -1.2];
        ratio = (sin1/sin2).toFixed(4);
      }
      rayIn = [-1.2*Math.tan(th1), 1.2, 0, 0];
    } else {
      sin2 = (n2/n1)*sin1;
      if(sin2 > 1){ tir=true; ratio='全反射'; }
      else {
        th2 = Math.asin(sin2);
        rayRefr = [0,0, -1.2*Math.tan(th2), 1.2];
        ratio = (sin1/sin2).toFixed(4);
      }
      rayIn = [1.2*Math.tan(th1), -1.2, 0, 0];
    }

    // 界面与法线
    ctx.strokeStyle='#000'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(sx(-2),sy(0)); ctx.lineTo(sx(2),sy(0)); ctx.stroke();
    ctx.strokeStyle='#888'; ctx.lineWidth=1.5; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(sx(0),sy(-1.5)); ctx.lineTo(sx(0),sy(1.5)); ctx.stroke();
    ctx.setLineDash([]);
    // 入射光（红）
    drawArrow(rayIn[0],rayIn[1],rayIn[2],rayIn[3],'#e53935');
    // 折射光（蓝）
    if(rayRefr) drawArrow(rayRefr[0],rayRefr[1],rayRefr[2],rayRefr[3],'#1e88e5');

    // 介质文字标注
    var airPos = (direction==='am')? [1.2,0.8] : [1.2,-0.8];
    var medPos = (direction==='am')? [1.2,-0.8] : [1.2,0.8];
    ctx.font='bold 14px "Microsoft YaHei", sans-serif'; ctx.fillStyle='#000';
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('空气', sx(airPos[0]), sy(airPos[1]));
    ctx.fillText('水/玻璃', sx(medPos[0]), sy(medPos[1]));

    // 数据表
    var rows = [
      ['入射角 θ₁', thetaDeg.toFixed(2)+'°'],
      ['折射角 θ₂', tir? '全反射' : (th2*180/Math.PI).toFixed(2)+'°'],
      ['折射率 n₂', n2.toFixed(3)],
      ['sinθ₁/sinθ₂', ratio]
    ];
    drawGrid(rows);
  }

  var el = document.getElementById('th'), out = document.getElementById('thv');
  el.addEventListener('input', function(){
    thetaDeg = parseFloat(el.value);
    out.textContent = thetaDeg.toFixed(0)+'°';
    draw();
  });
  el.value = thetaDeg;

  function segBind(id, cb){
    var box = document.getElementById(id);
    box.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        box.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
        b.classList.add('on');
        cb(b.getAttribute('data-v'));
        draw();
      });
    });
  }
  segBind('medSeg', function(v){ medium = parseInt(v); });
  segBind('dirSeg', function(v){ direction = v; });
  draw();
})();
</script>
</body>
</html>
