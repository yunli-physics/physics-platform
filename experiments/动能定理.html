<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动能定理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f5f7fa; color: #222; padding: 20px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .ctrl { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .ctrl label { width: 110px; font-size: 14px; }
  .ctrl input[type=range] { width: 200px; }
  .ctrl .val { width: 55px; text-align: right; font-variant-numeric: tabular-nums;
               font-weight: 600; color: #1565c0; }
  canvas { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; display:block; }
  .controls { min-width: 280px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>动能定理</h1>
  <p class="desc">恒力 F 使物体（m = 1）沿力方向移动距离 s。由动能定理 F·s = ½mv²，动点坐标 (v, E<sub>k</sub>)。</p>
  <div class="panel">
    <div class="row">
      <div class="controls">
        <div class="ctrl">
          <label for="F">Force F</label>
          <input type="range" id="F" min="0" max="10" step="0.1" value="5">
          <span class="val" id="Fv">5.0</span>
        </div>
        <div class="ctrl">
          <label for="s">Displacement s</label>
          <input type="range" id="s" min="0" max="10" step="0.1" value="5">
          <span class="val" id="sv">5.0</span>
        </div>
        <p style="font-size:14px;color:#444;margin-top:14px;line-height:1.8;">
          v = √(2Fs/m) = <span id="vout" style="color:#1565c0;font-weight:600;">7.1</span><br>
          E<sub>k</sub> = F·s = <span id="ekout" style="color:#1565c0;font-weight:600;">25.0</span> J
        </p>
      </div>
      <canvas id="cv" width="460" height="460"></canvas>
    </div>
  </div>
</div>
<script>
(function(){
  var m = 1, F = 5, s = 5;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  // PlotRange {{0,5},{0,30}}
  var xMin=0, xMax=5, yMin=0, yMax=30;
  var padL=46, padR=18, padT=20, padB=40;
  function sx(x){ return padL + (x-xMin)/(xMax-xMin)*(W-padL-padR); }
  function sy(y){ return H-padB - (y-yMin)/(yMax-yMin)*(H-padT-padB); }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // axes
    ctx.strokeStyle='#888'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(sx(0),sy(0)); ctx.lineTo(sx(xMax),sy(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(0),sy(0)); ctx.lineTo(sx(0),sy(yMax)); ctx.stroke();
    ctx.fillStyle='#555'; ctx.font='14px sans-serif';
    ctx.fillText('v', sx(xMax)-8, sy(0)+20);
    ctx.save(); ctx.translate(16,(sy(0)+sy(yMax))/2); ctx.rotate(-Math.PI/2);
    ctx.fillText('E_k', -10, 0); ctx.restore();
    // v = sqrt(2 F s / m), ek = F s
    var vv = Math.sqrt(2*F*s/m);
    var ek = F*s;
    // red point
    ctx.fillStyle='red';
    ctx.beginPath(); ctx.arc(sx(vv), sy(ek), 6, 0, 2*Math.PI); ctx.fill();
    // label "v=.. \n E_k=.." at (v, ek+2)
    var txt = 'v=' + vv.toFixed(1) + '\nE_k=' + ek.toFixed(1);
    ctx.fillStyle='#222'; ctx.font='12px sans-serif';
    var lx=sx(vv), ly=sy(ek+2);
    var lines = txt.split('\n');
    for(var i=0;i<lines.length;i++) ctx.fillText(lines[i], lx, ly - (lines.length-1-i)*14);
    // readouts
    document.getElementById('vout').textContent = vv.toFixed(1);
    document.getElementById('ekout').textContent = ek.toFixed(1);
  }

  function bind(id, key){
    var el=document.getElementById(id);
    el.addEventListener('input', function(){
      if(key==='F') F=parseFloat(el.value); else s=parseFloat(el.value);
      document.getElementById(id+'v').textContent = parseFloat(el.value).toFixed(1);
      draw();
    });
  }
  document.getElementById('F').value=F; document.getElementById('s').value=s;
  bind('F','F'); bind('s','s');
  draw();
})();
</script>
</body>
</html>
