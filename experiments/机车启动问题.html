<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机车启动问题</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f5f7fa; color: #222; padding: 20px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .seg { display:inline-flex; border:1px solid #ccc; border-radius:6px; overflow:hidden; margin-bottom:12px; }
  .seg button { border:0; background:#fff; padding:7px 16px; font-size:14px; cursor:pointer; }
  .seg button.active { background:#1565c0; color:#fff; }
  .ctrl { display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap; }
  .ctrl label { width:120px; font-size:14px; }
  .ctrl input[type=range] { flex:1; min-width:180px; }
  .ctrl .val { width:70px; text-align:right; font-variant-numeric: tabular-nums;
               font-weight:600; color:#1565c0; }
  canvas { width:100%; background:#fff; border:1px solid #e0e0e0; border-radius:8px; display:block; margin-bottom:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>机车启动问题</h1>
  <p class="desc">机车参数 P=10000 W、阻力 f=200 N、m=500 kg、额定加速度 a₀=0.2 m/s²、v<sub>max</sub>=P/f=50 m/s。对比恒功率与恒加速度两种启动方式下 v、F、a 随时间的变化。</p>
  <div class="panel">
    <div class="seg" id="modeSeg">
      <button data-m="1" class="active">恒定功率启动</button>
      <button data-m="2">恒定加速度启动</button>
    </div>
    <div class="ctrl">
      <label for="t">时间 t (s)</label>
      <input type="range" id="t" min="0.001" max="20" step="0.1" value="0.001">
      <span class="val" id="tv">0.0</span>
    </div>
  </div>
  <canvas id="cvV" width="940" height="200"></canvas>
  <canvas id="cvF" width="940" height="200"></canvas>
  <canvas id="cvA" width="940" height="200"></canvas>
</div>
<script>
(function(){
  var P=10000, f=200, m=500, a0=0.2, vMax=P/f, tMaxFixed=20;
  var mode=1, t=0.001;

  function compute(){
    var tSafe = Math.max(t,0.001);
    var vFunc, FFunc, aFunc;
    if(mode===1){
      vFunc = Math.sqrt(2*P*tSafe/m);
      FFunc = P/vFunc;
      aFunc = (FFunc-f)/m;
    } else {
      var F1=f+m*a0, t1=P/(F1*a0), v1=a0*t1;
      vFunc = (t<=t1) ? a0*t : Math.sqrt(v1*v1 + 2*P*(t-t1)/m);
      FFunc = (t<=t1) ? F1 : P/vFunc;
      aFunc = (t<=t1) ? a0 : (FFunc-f)/m;
    }
    return {v:vFunc, F:FFunc, a:aFunc};
  }

  function makePlot(canvas, yMin, yMax, label, color, valFmt, valOffY){
    var ctx=canvas.getContext('2d'), W=canvas.width, H=canvas.height;
    var xMin=0, xMax=tMaxFixed, padL=50,padR=20,padT=26,padB=34;
    function sx(x){ return padL + (x-xMin)/(xMax-xMin)*(W-padL-padR); }
    function sy(y){ return H-padB - (y-yMin)/(yMax-yMin)*(H-padT-padB); }
    function draw(yVal, yLab){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle='#888'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(sx(0),sy(yMin)); ctx.lineTo(sx(0),sy(yMax)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx(0),sy(yMin)); ctx.lineTo(sx(xMax),sy(yMin)); ctx.stroke();
      ctx.fillStyle='#555'; ctx.font='12px sans-serif';
      ctx.fillText('时间 t (s)', sx(xMax)-70, H-10);
      ctx.save(); ctx.translate(14,(sy(yMin)+sy(yMax))/2); ctx.rotate(-Math.PI/2);
      ctx.fillText(yLab, -10, 0); ctx.restore();
      // label at top-left (original at {0,2})
      ctx.fillStyle=color; ctx.font='bold 13px sans-serif';
      ctx.fillText(label, sx(0)+6, sy(yMax)+16);
      // red point
      ctx.fillStyle='red';
      ctx.beginPath(); ctx.arc(sx(t), sy(yVal), 5, 0, 2*Math.PI); ctx.fill();
      ctx.fillStyle='#222'; ctx.font='12px sans-serif';
      ctx.fillText(valFmt(yVal), sx(t)+6, sy(yVal)+valOffY);
    }
    return draw;
  }

  var drawV = makePlot(document.getElementById('cvV'), 0, vMax+5, '速度 v (m/s)', '#1565c0',
                       function(v){return v.toFixed(1);}, -6);
  var drawF = makePlot(document.getElementById('cvF'), f, 2000, '牵引力 F (N)', '#ef6c00',
                       function(F){return F.toFixed(1);}, -8);
  var drawA = makePlot(document.getElementById('cvA'), 0, a0+0.1, '加速度 a (m/s²)', '#2e7d32',
                       function(a){return a.toFixed(2);}, -6);

  function drawAll(){
    var r=compute();
    document.getElementById('tv').textContent = t.toFixed(1);
    drawV(r.v, 'v');
    drawF(r.F, 'F');
    drawA(r.a, 'a');
  }

  var elT=document.getElementById('t');
  elT.addEventListener('input', function(){ t=parseFloat(elT.value); drawAll(); });
  document.querySelectorAll('#modeSeg button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#modeSeg button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
      mode = parseInt(b.dataset.m,10);
      drawAll();
    });
  });
  elT.value=t;
  drawAll();
})();
</script>
</body>
</html>
