<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泊松亮斑</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
         background: #f5f7fa; color: #222; padding: 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px;
           box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .ctrl { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  .ctrl label { width: 160px; font-size: 14px; }
  .ctrl input[type=range] { flex: 1; min-width: 180px; }
  .ctrl .val { width: 90px; text-align: right; font-variant-numeric: tabular-nums;
               font-weight: 600; color: #1565c0; }
  canvas { width: 100%; background: #000; border: 1px solid #222; border-radius: 8px; display:block; }
  .info { margin-top: 12px; font-size: 13px; color:#444; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>泊松亮斑（菲涅耳圆孔衍射）</h1>
  <p class="desc">按原 Mathematica 数值公式在 canvas 上逐像素计算：复振幅 u(x,y)∝e<sup>ik(x²+y²)/2z</sup>·∫₀ᵃ e<sup>ikρ₁²/2z</sup>ρ₁J₀(kρρ₁/z)dρ₁，光强 I=|u|²，灰度显示（亮处为白）。</p>
  <div class="panel">
    <div class="ctrl">
      <label for="lam">波长 λ (nm)</label>
      <input type="range" id="lam" min="400" max="760" step="0.1" value="632.8">
      <span class="val" id="lamv">632.8 nm</span>
    </div>
    <div class="ctrl">
      <label for="a">圆孔半径 a (mm)</label>
      <input type="range" id="a" min="0.2" max="3.0" step="0.05" value="1.0">
      <span class="val" id="av">1.00 mm</span>
    </div>
    <div class="ctrl">
      <label for="z">观察距离 z (m)</label>
      <input type="range" id="z" min="0.3" max="3.0" step="0.05" value="1.0">
      <span class="val" id="zv">1.00 m</span>
    </div>
  </div>
  <canvas id="cv" width="480" height="480"></canvas>
  <div class="info" id="info"></div>
</div>
<script>
(function(){
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var N = 256;              // 分辨率
  var xMax = 0.01, yMax = 0.01; // 接收屏范围 m（与原代码一致）

  var lam_nm = 632.8, a_mm = 1.0, z_m = 1.0;

  // Bessel J0（Numerical Recipes 近似，精度约 7 位）
  function j0(x){
    if(x < 0) x = -x;
    var ax = x;
    if(ax < 8.0){
      var y = x*x;
      var p1 = 57568490574.0 + y*(-13362590354.0 + y*(651619640.7 + y*(-11214424.18 + y*(77392.33017 + y*(-184.9052456)))));
      var q1 = 57568490574.0 + y*(2021029601.0 + y*(297271143.0 + y*(1709937.453 + y*(56890.20247 + y*1.0)));
      return p1/q1;
    } else {
      var z = 8.0/ax;
      var y = z*z;
      var xx = ax - 0.785398164;
      var p1 = 1.0 + y*(-0.1098628627e-2 + y*(0.2734510407e-4 + y*(-0.2073370639e-5 + y*0.2093887211e-6)));
      var q1 = -0.1562499995e-1 + y*(0.1430488765e-3 + y*(-0.6911147651e-5 + y*(0.7621095161e-6 - y*0.934935152e-7)));
      return Math.sqrt(0.636619772/ax)*(Math.cos(xx)*p1 - z*Math.sin(xx)*q1);
    }
  }

  // 径向积分：返回 |I0|^2，I0 = ∫_0^a exp(i k ρ1²/(2z)) ρ1 J0(k ρ ρ1/z) dρ1
  function radialIntensity(rho, k, a, z){
    var nInt = 400;
    var dr = a/nInt;
    var re = 0, im = 0;
    // Simpson 积分（复被积函数 f(ρ1)=ρ1 J0(...) exp(i k ρ1²/2z)）
    function f(rl){
      var ph = k*rl*rl/(2*z);
      var bj = j0(k*rho*rl/z);
      return [rl*bj*Math.cos(ph), rl*bj*Math.sin(ph)];
    }
    var f0 = f(0.0), fn = f(a);
    re = (f0[0]+fn[0])*0.5; im = (f0[1]+fn[1])*0.5;
    for(var i=1;i<nInt;i++){
      var rl = i*dr;
      var ff = f(rl);
      var w = (i%2===1)?2:1;
      re += w*ff[0]; im += w*ff[1];
    }
    re *= dr/3; im *= dr/3;
    return re*re + im*im;
  }

  function draw(){
    var lam = lam_nm*1e-9;
    var a = a_mm*1e-3;
    var z = z_m;
    var k = 2*Math.PI/lam;

    // 利用径向对称：只算 rho 从 0 到 rhoMax
    var rhoMax = Math.sqrt(xMax*xMax + yMax*yMax);
    var NR = 256;
    var prof = new Float64Array(NR+1);
    var maxI = 0;
    for(var i=0;i<=NR;i++){
      var rho = rhoMax*i/NR;
      var v = radialIntensity(rho, k, a, z);
      prof[i] = v;
      if(v>maxI) maxI = v;
    }
    // 渲染
    var img = ctx.createImageData(N,N);
    var half = N/2;
    var pxm = (2*xMax)/N; // 每像素物理尺寸
    for(var py=0; py<N; py++){
      var y = (py-half+0.5)*pxm;
      for(var px=0; px<N; px++){
        var x = (px-half+0.5)*pxm;
        var rho = Math.sqrt(x*x+y*y);
        var idx = Math.min(NR, Math.round(rho/rhoMax*NR));
        var v = prof[idx]/maxI; // 0..1 归一化
        var g = Math.round(Math.pow(v, 0.5)*255); // 轻微 gamma 提升可见度
        var o = (py*N+px)*4;
        img.data[o]=g; img.data[o+1]=g; img.data[o+2]=g; img.data[o+3]=255;
      }
    }
    ctx.putImageData(img, 0, 0);

    var F = a*a/(lam*z);
    document.getElementById('info').textContent =
      '菲涅耳数 F = a²/(λ z) = ' + F.toFixed(2) +
      '；中央强度/平均强度 已按最大值归一化。波数 k = ' + (k).toExponential(3) + ' m⁻¹。';
  }

  function bind(id, key, fmt, suffix){
    var el = document.getElementById(id), out = document.getElementById(id+'v');
    el.addEventListener('input', function(){
      var v = parseFloat(el.value);
      if(key==='lam') lam_nm=v; else if(key==='a') a_mm=v; else z_m=v;
      out.textContent = fmt(v) + (suffix||'');
      draw();
    });
  }
  document.getElementById('lam').value = lam_nm;
  document.getElementById('a').value = a_mm;
  document.getElementById('z').value = z_m;
  bind('lam','lam',function(v){return v.toFixed(1);},' nm');
  bind('a','a',function(v){return v.toFixed(2);},' mm');
  bind('z','z',function(v){return v.toFixed(2);},' m');
  draw();
})();
</script>
</body>
</html>
